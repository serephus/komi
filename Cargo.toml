[package]
name = "komi"
version = "0.1.0"
edition = "2021"
description = "Correspondence Go server. No clocks, no result: both players pass and the game ends."
publish = false

[dependencies]
argon2 = "0.6"
axum = "0.8"
base64ct = "1.7"
getrandom = "0.4"
maud = "0.27"
toml = "1"
serde = { version = "1", features = ["derive"] }
sha2 = "0.11"
subtle = "2.6"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "macros"] }
tokio = { version = "1", features = [
    "macros",
    "net",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
tokio-stream = { version = "0.1", features = ["sync"] }
tower-http = { version = "0.6", features = ["compression-gzip", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
redb = "4.4.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
